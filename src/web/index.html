<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F4F1EA" />
    <title>&#65279;</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232F6B55'/%3E%3Ctext x='16' y='23' text-anchor='middle' fill='%23FAF8F3' font-size='22'%3E∞%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <aside id="sidebar" class="sidebar" aria-label="项目导航">
      <button
        class="mobile-navigation"
        data-action="navigation"
        aria-label="关闭项目导航"
      >
        ×
      </button>

      <a class="brand" href="/">
        <span class="brand-mark">∞</span>
        <span>无限画布</span>
      </a>

      <section class="sidebar-block">
        <div class="section-heading">
          <h2>画布分组</h2>
          <button data-action="group" aria-label="新建分组" title="新建分组">＋</button>
        </div>
        <nav id="groups" aria-label="画布分组"></nav>
      </section>

      <section class="sidebar-block">
        <div class="section-heading">
          <h2>项目画布</h2>
          <button data-action="canvas" aria-label="新建画布" title="新建画布">＋</button>
        </div>
        <nav id="canvases" aria-label="画布列表"></nav>
      </section>

      <section class="sidebar-block experience-section">
        <div class="section-heading">
          <h2>跨项目经验库</h2>
          <span id="experience-count" class="badge">0</span>
        </div>
        <label class="sr-only" for="experience-search">搜索经验</label>
        <input
          id="experience-search"
          type="search"
          placeholder="搜索经验…"
        />
        <label class="sr-only" for="experience-category">经验分类</label>
        <select id="experience-category">
          <option value="">全部分类</option>
        </select>
        <div id="experiences" aria-live="polite"></div>
      </section>

      <footer class="sidebar-footer"></footer>
    </aside>

    <main>
      <header class="topbar">
        <button
          class="mobile-navigation"
          data-action="navigation"
          aria-controls="sidebar"
          aria-expanded="false"
        >
          ☰
        </button>

        <div class="title-area">
          <div class="eyebrow" id="project-group">画布分组</div>
          <div class="title-row">
            <h1 id="project-title">无限画布</h1>
            <span id="project-status" class="badge">进行中</span>
          </div>
          <p id="canvas-description" class="subtitle" hidden></p>
        </div>

        <div class="mcp-connect-panel" id="mcp-quick-bar" aria-label="AI 连接">
          <div class="mcp-provider-buttons">
            <button
              type="button"
              class="provider-pill provider-codex"
              data-action="quick-ai"
              data-provider="codex"
            >
              <span class="provider-dot"></span>
              <strong>Codex</strong>
            </button>
            <button
              type="button"
              class="provider-pill provider-claude"
              data-action="quick-ai"
              data-provider="claude"
            >
              <span class="provider-dot"></span>
              <strong>Claude</strong>
            </button>
            <button
              type="button"
              class="provider-pill provider-gemini"
              data-action="quick-ai"
              data-provider="gemini"
            >
              <span class="provider-dot"></span>
              <strong>Gemini</strong>
            </button>
            <button
              type="button"
              class="provider-pill provider-deepseek"
              data-action="quick-ai"
              data-provider="deepseek"
            >
              <span class="provider-dot"></span>
              <strong>DeepSeek</strong>
            </button>
            <button
              type="button"
              class="handoff-open-btn"
              data-action="handoff"
            >
              交接文档
            </button>
            <span id="sync-status" class="sync" role="status">已同步</span>
          </div>
        </div>
      </header>

      <div class="toolbar" aria-label="画布操作">
        <div class="toolbar-buttons">
          <button class="primary" data-action="record">＋ 记一条</button>
          <button data-action="consolidate">阶段整理</button>
          <button data-action="advance">下一阶段</button>
          <button class="gold-button" data-action="finalize">总整理</button>
        </div>

        <nav id="stage-jumps" class="stage-jumps" aria-label="阶段跳转"></nav>
        <span id="canvas-stats" class="muted stats-pill"></span>
      </div>

      <div
        id="viewport"
        tabindex="0"
        aria-label="无限画布视口"
      >
        <div id="world"></div>
        <div id="empty-state" class="empty-state" hidden>
          <span class="empty-mark">∞</span>
          <h2>暂无画布</h2>
          <div class="empty-actions">
            <button data-action="group">新建分组</button>
            <button class="primary" data-action="canvas">新建画布</button>
          </div>
        </div>
      </div>

      <footer class="canvas-footer">
        <span></span>
        <div class="zoom-controls">
          <button data-action="zoom-out" aria-label="缩小">−</button>
          <output id="zoom-level">100%</output>
          <button data-action="zoom-in" aria-label="放大">＋</button>
          <button data-action="fit">适应全图</button>
        </div>
      </footer>
    </main>

    <dialog id="drawer" class="drawer" aria-labelledby="drawer-title">
      <header>
        <div>
          <span class="eyebrow">MCP 接入与交接</span>
          <h2 id="drawer-title">交接文档</h2>
        </div>
        <button data-action="close-drawer" aria-label="关闭">×</button>
      </header>
      <div id="drawer-content"></div>
    </dialog>

    <dialog id="modal" aria-labelledby="modal-title">
      <form id="action-form">
        <header>
          <h2 id="modal-title"></h2>
          <button type="button" data-action="close-modal" aria-label="关闭">
            ×
          </button>
        </header>
        <p id="modal-context" class="muted"></p>
        <div id="form-fields"></div>
        <p id="form-error" class="error" role="alert"></p>
        <footer>
          <button type="button" data-action="close-modal">取消</button>
          <button id="form-submit" class="primary" type="submit">保存</button>
        </footer>
      </form>
    </dialog>

    <div id="notice" role="status" hidden></div>
  </body>
</html>
